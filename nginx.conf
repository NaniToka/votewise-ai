server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable version disclosure
    server_tokens off;

    # Health check endpoint for Cloud Run uptime monitoring
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Vite hashed assets — cache aggressively (1 year)
    # Vite appends content hashes to filenames (e.g. index-BZjx7eB0.js)
    # so these files are safe to cache forever
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — all unknown routes return index.html
    # This enables React Router client-side navigation
    location / {
        try_files $uri $uri/ /index.html;

        # Never cache index.html so users always get fresh entry point
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
